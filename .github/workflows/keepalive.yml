# Empêche Supabase de mettre la base en pause pour inactivité (projets gratuits : 7 jours).
# Tous les deux jours, ce workflow appelle la fonction keepalive() de la base,
# avec l'adresse et la clé publique lues dans js/config.js.
# Le 1er du mois, il ajoute aussi un petit commit : GitHub désactive les tâches
# planifiées d'un dépôt resté 60 jours sans activité, ce commit l'en empêche.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '23 5 */2 * *'     # tous les 2 jours, 5h23 UTC
  workflow_dispatch:            # bouton « Run workflow » pour tester à la main

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Appeler la base
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/config.js | head -1)
          KEY=$(grep -oE "eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+" js/config.js | head -1)
          echo "Ping de $URL"
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo

      - name: Garder le dépôt actif (le 1er du mois)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/derniere-activite.txt
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add .github/derniere-activite.txt
            git commit -m "Maintien en activité du dépôt" && git push
          fi
